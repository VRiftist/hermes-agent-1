<!DOCTYPE html>
<html>
<head>
<title>LumenHub — Local AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f0f1a;color:#eee;height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#162032;border-bottom:1px solid #2a2a40}
.topbar h1{font-size:18px;color:#e94560}
.topbar .model-info{color:#aaa;font-size:12px;flex:1;text-align:center}
.topbar .status{font-size:11px;padding:3px 8px;border-radius:4px}
.topbar .status.ok{background:#2d6a4f;color:#fff}
.topbar .status.err{background:#8b2020;color:#fff}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{margin:4px 0;padding:12px 16px;border-radius:10px;max-width:82%;word-wrap:break-word;line-height:1.5;font-size:15px}
.user{background:#2d6a4f;align-self:flex-end;border-bottom-right-radius:2px}
.bot{background:#2a2a40;align-self:flex-start;border-bottom-left-radius:2px}
.msg .label{font-size:10px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.msg .meta{font-size:10px;color:#555;margin-top:4px}
.input-row{display:flex;gap:8px;padding:12px 16px;background:#162032;border-top:1px solid #2a2a40}
#input{flex:1;padding:10px 14px;border:1px solid #2a2a40;border-radius:8px;font-size:15px;background:#1a1a2e;color:#fff;outline:none}
#input:focus{border-color:#e94560}
#send{padding:10px 20px;border:none;border-radius:8px;background:#e94560;color:#fff;font-size:14px;cursor:pointer;font-weight:600}
#send:disabled{opacity:0.5;cursor:default}
.hint{color:#555;font-size:11px;text-align:center;padding:4px}
.model-selector{display:flex;gap:4px;padding:8px 16px;background:#162032;border-bottom:1px solid #2a2a40}
.model-btn{padding:4px 12px;border:1px solid #2a2a40;border-radius:6px;font-size:12px;cursor:pointer;background:#1a1a2e;color:#aaa;transition:0.2s}
.model-btn.active{background:#e94560;color:#fff;border-color:#e94560}
.model-btn:hover{border-color:#e94560}
</style>
</head>
<body>
<div class="topbar">
  <h1>🦙 LumenHub</h1>
  <div class="model-info" id="modelInfo">qwen3:14b</div>
  <div class="status err" id="status">offline</div>
</div>
<div class="model-selector" id="modelSelector">
  <button class="model-btn active" data-model="qwen3:14b" onclick="switchModel(this)">Qwen 14B</button>
  <button class="model-btn" data-model="qwen3:8b" onclick="switchModel(this)">Qwen 8B</button>
  <button class="model-btn" data-model="qwen2.5-coder:7b" onclick="switchModel(this)">Coder 7B</button>
  <button class="model-btn" data-model="qwen2.5-coder:14b" onclick="switchModel(this)">Coder 14B</button>
  <button class="model-btn" data-model="qwen2.5-coder:32b-instruct-q4_K_M" onclick="switchModel(this)">Coder 32B</button>
</div>
<div id="chat"></div>
<div class="input-row">
  <input id="input" placeholder="Type message (Enter to send, Tab for model switch)" onkeydown="onKey(event)"/>
  <button id="send" onclick="sendMsg()">Send</button>
</div>
<div class="hint">Messages are processed locally on your Mac. No data leaves the machine.</div>

<script>
const chatEl=document.getElementById('chat');
const statusEl=document.getElementById('status');
const modelInfoEl=document.getElementById('modelInfo');
let currentModel='qwen3:14b';
let thinking=false;

function setStatus(text,ok){statusEl.textContent=text;statusEl.className='status '+(ok?'ok':'err')}

function switchModel(btn){
  if(thinking)return;
  document.querySelectorAll('.model-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentModel=btn.dataset.model;
  modelInfoEl.textContent=currentModel;
  setStatus(currentModel+' selected',true);
}

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}
}

function addMsg(role,text,meta){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML='<div class="label">'+role+'</div><div>'+text.replace(/\n/g,'<br>')+'</div>';
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

function systemInfo(){
  addMsg('bot','System: Ollama '+currentModel+' running locally on your Mac.','ℹ️');
}

async function sendMsg(){
  const inp=document.getElementById('input');
  const text=inp.value.trim();
  if(!text||thinking)return;
  addMsg('user',text);
  thinking=true;
  setStatus('thinking...',false);
  inp.value='';inp.disabled=true;
  const start=Date.now();

  try{
    const r=await fetch('http://127.0.0.1:11434/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:currentModel,prompt:text,stream:false,temperature:0.7,options:{num_predict:1000}})
    });
    const data=await r.json();
    const ms=Date.now()-start;
    if(r.ok&&data.response){
      setStatus('✓ '+currentModel+' ('+ms+'ms)',true);
      addMsg('bot',data.response,currentModel+' · '+ms+'ms · local');
    }else{
      setStatus('Error: '+(data.error||r.status),false);
      addMsg('bot','Error: '+(data.error||JSON.stringify(data)),'❌');
    }
  }catch(e){
    setStatus('Connection failed: '+e.message,false);
    addMsg('bot','❌ '+e.message,'connection error');
  }
  thinking=false;inp.disabled=false;inp.focus();
}

// Check Ollama on load
(async()=>{
  try{
    const r=await fetch('http://127.0.0.1:11434/api/tags');
    if(r.ok){setStatus('Ollama connected',true);systemInfo()}
    else{setStatus('Ollama returned '+r.status,false)}
  }catch(e){setStatus('Ollama not found: '+e.message,false)}
  inp.focus();
})();
</script>
</body>
</html>
